[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "depviz"
dynamic = ["version"]
description = "Find dependency blast points and version conflicts in an installed environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tien Du" }]
dependencies = [
  "packaging>=24.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
binary = [
  "pyinstaller>=6.22,<7",
]
dev = [
  "pytest>=8.0",
  "ruff==0.16.7",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
depviz = "depviz.main:main"

[tool.hatch.version]
path = "src/depviz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/depviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI lint policy explicit instead of inheriting Ruff's changing defaults.
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
